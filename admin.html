<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advice Trang Smart Service — Staff Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#081B32; --navy2:#0E2A4D; --blue:#2F6BFF; --blue-deep:#1948D6; --sky:#EBF2FF; --cyan:#00C2D1;
  --ink:#10233F; --muted:#5C7089; --line:#E3EAF5; --paper:#FFFFFF; --bg:#F6F9FE;
  --ok:#16A34A; --ok-bg:#E9F9EF; --warn:#D98A0B; --warn-bg:#FDF3E2; --info:#2F6BFF; --info-bg:#EBF2FF;
  --other:#B8590C; --other-bg:#FCEEE1; --danger:#DC2626; --danger-bg:#FDEBEB;
  --gold:#C9A227; --gold-deep:#9C7D15; --gold-bg:#FBF3DC;
  --shadow:0 10px 30px rgba(10,37,64,.09), 0 2px 6px rgba(10,37,64,.06);
  --shadow-lg:0 24px 60px rgba(8,27,50,.22);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'IBM Plex Sans Thai','Kanit',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Kanit','IBM Plex Sans Thai',sans-serif;}
button{font-family:inherit;cursor:pointer;}
img{display:block;object-fit:cover;}

.conn-strip{background:var(--navy);color:#9db6dd;font-size:11.5px;text-align:center;padding:6px 14px;}
.conn-strip b{color:#7fd8e0;}

/* login */
.login-wrap{min-height:calc(100vh - 33px);display:flex;align-items:stretch;}
.login-visual{flex:1.1;position:relative;overflow:hidden;display:none;}
.login-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05);}
.login-visual .scrim{position:absolute;inset:0;background:linear-gradient(190deg,rgba(6,16,34,.35),rgba(6,16,34,.92));}
.login-visual .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:50px;color:#fff;}
.login-visual .content h2{font-size:26px;margin:0 0 10px;line-height:1.35;}
.login-visual .content p{font-size:13px;color:#c9d9f2;max-width:380px;line-height:1.7;}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg);}
.login-card{width:380px;max-width:100%;}
.login-card .lb{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Kanit';font-weight:800;margin-bottom:18px;box-shadow:var(--shadow-lg);}
.login-card h3{margin:0 0 4px;font-size:21px;color:var(--navy);}
.login-card p{font-size:12.5px;color:var(--muted);margin:0 0 26px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;font-family:inherit;background:#fbfdff;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--blue);background:#fff;}
.login-hint{background:var(--gold-bg);border:1px solid #e8d488;border-radius:11px;padding:11px 14px;font-size:11.5px;color:#6b551a;margin-top:18px;line-height:1.65;}
.err-text{color:var(--danger);font-size:12px;margin-top:8px;display:none;}
.btn-primary-lg{width:100%;margin-top:16px;padding:13px;background:linear-gradient(120deg,var(--navy),var(--blue-deep));color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(25,72,214,.28);}

/* shell */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 33px);}
.sidebar{background:linear-gradient(180deg,var(--navy),#0a2140);color:#cfe0fb;padding:22px 15px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.s-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:15px;}
.s-brand .bb{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Kanit';font-size:14px;color:#fff;}
.s-brand .bt{font-size:13.5px;font-weight:700;color:#fff;font-family:'Kanit';line-height:1.2;}
.s-brand .bs{font-size:10px;color:#8fa8cc;}
.s-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.s-nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:#b9cbe8;padding:10px 12px;border-radius:10px;font-size:13px;text-align:left;font-weight:500;position:relative;}
.s-nav button .ic{width:18px;text-align:center;}
.s-nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.s-nav button.active{background:linear-gradient(120deg,var(--blue-deep),var(--blue));color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.28);}
.s-nav .grp{font-size:10px;letter-spacing:.6px;color:#5f7aa3;padding:14px 12px 4px;}
.qbadge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;}
.s-user{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:10px;display:flex;align-items:center;gap:9px;}
.s-user .av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);}
.s-user .av img{width:100%;height:100%;}
.s-user .nm{font-size:12.5px;color:#fff;font-weight:700;}
.s-user .rl{font-size:10.5px;color:#8fa8cc;}
.s-user .out{margin-left:auto;background:rgba(255,255,255,.08);border:none;color:#cfe0fb;width:28px;height:28px;border-radius:8px;font-size:12px;}

.main{padding:28px 32px 60px;overflow-x:hidden;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h2{margin:0;font-size:22px;color:var(--navy);}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:26px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:11px;}
.kpi .k-val{font-family:'Kanit';font-size:25px;font-weight:800;color:var(--navy);}
.kpi .k-lb{font-size:11.5px;color:var(--muted);margin-top:2px;}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);}
.panel h4{margin:0 0 15px;font-size:14.5px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px;}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:6px 6px 0 0;position:relative;min-height:4px;}
.bar-chart .bar.peak{background:linear-gradient(180deg,#ffb648,var(--warn));}
.bar-chart-labels{display:flex;gap:6px;margin-top:7px;}
.bar-chart-labels span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);}

.table{width:100%;border-collapse:collapse;font-size:12.8px;}
.table th{text-align:left;padding:11px 11px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.table td{padding:12px 11px;border-bottom:1px solid #eef3fb;color:var(--ink);vertical-align:middle;}
.table tr:hover td{background:#fbfdff;}
.mini-badge{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:700;}
.prod-thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;min-width:260px;}
.search-box input{border:none;outline:none;font-size:13px;flex:1;font-family:inherit;}
.btn{background:linear-gradient(120deg,var(--navy),var(--blue-deep));color:#fff;border:none;padding:11px 18px;border-radius:11px;font-weight:700;font-size:12.8px;}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
.icon-sm{background:var(--sky);border:none;width:30px;height:30px;border-radius:8px;font-size:12px;color:var(--blue-deep);}
.icon-sm.del{background:var(--danger-bg);color:var(--danger);}
.row-actions{display:flex;gap:6px;}
.status-select{border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:11.5px;font-family:inherit;}

.status-pulse-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px;}
.pulse-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}
.pulse-card .pv{font-family:'Kanit';font-size:21px;font-weight:800;color:var(--navy);}
.pulse-card .pl{font-size:11px;color:var(--muted);margin-top:2px;}
.pulse-card .pbar{height:6px;background:#eef3fb;border-radius:4px;margin-top:11px;overflow:hidden;}
.pulse-card .pbar i{display:block;height:100%;background:var(--blue);border-radius:4px;}

/* live chat */
.chat-queue-list{display:flex;flex-direction:column;gap:10px;}
.cq-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;transition:.15s;}
.cq-item.queued{border-color:#f3ddab;background:var(--gold-bg);}
.cq-item.active{border-color:#b9d2f5;}
.cq-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.cq-head .nm{font-weight:700;font-size:13px;color:var(--navy);}
.cq-head .meta{font-size:11px;color:var(--muted);}
.cq-thread{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;}
.cq-item.open .cq-thread{display:block;}
.cq-messages{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px 2px;margin-bottom:12px;}
.cq-msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;}
.cq-msg.customer{background:var(--sky);align-self:flex-start;}
.cq-msg.staff{background:linear-gradient(120deg,var(--navy),var(--blue-deep));color:#fff;align-self:flex-end;}
.cq-msg.system{align-self:center;color:var(--muted);font-size:11px;background:transparent;}
.cq-reply{display:flex;gap:8px;}
.cq-reply input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:12.8px;font-family:inherit;}
.cq-reply button{background:var(--blue);color:#fff;border:none;padding:0 16px;border-radius:10px;font-weight:700;font-size:12px;}
.cq-actions{display:flex;gap:8px;margin-top:10px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 24px;border-radius:13px;font-size:13px;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.28);}
.overlay{position:fixed;inset:0;background:rgba(6,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px);}
.modal{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 34px 70px rgba(0,0,0,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:17px;color:var(--navy);}
.modal-close{background:var(--sky);border:none;width:32px;height:32px;border-radius:9px;font-size:14px;color:var(--muted);}
.modal-body{padding:24px 26px;}
.modal-foot{padding:17px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}


/* ===== sales reports ===== */
.report-filter{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:18px;}
.report-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.report-tabs button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:9px 15px;border-radius:10px;font-weight:700;font-size:12px;}
.report-tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.report-date{display:flex;gap:7px;align-items:center;}
.report-date input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:12px;color:var(--ink);}
.report-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px;}
.report-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}
.report-kpi .rv{font-family:'Kanit';font-size:23px;font-weight:800;color:var(--navy);margin-top:3px;}
.report-kpi .rl{font-size:11.5px;color:var(--muted);}
.report-kpi .ri{font-size:18px;}
.report-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;margin-bottom:18px;}
.report-chart{height:245px;display:flex;align-items:flex-end;gap:8px;padding:20px 5px 0;}
.report-bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;}
.report-bar{width:min(34px,80%);min-height:3px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:7px 7px 2px 2px;position:relative;}
.report-bar:hover{filter:brightness(.95);}
.report-bar .tip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:4px 7px;border-radius:6px;font-size:9px;white-space:nowrap;display:none;z-index:3;}
.report-bar:hover .tip{display:block;}
.report-bar-label{font-size:9px;color:var(--muted);margin-top:7px;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.report-list{display:flex;flex-direction:column;gap:10px;}
.report-rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef3fb;}
.report-rank:last-child{border-bottom:0;}
.report-rank .num{width:27px;height:27px;border-radius:8px;background:var(--sky);color:var(--blue-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
.report-rank .rn{flex:1;font-size:12.5px;font-weight:700;color:var(--ink);}
.report-rank .rq{font-size:11px;color:var(--muted);text-align:right;}
.report-rank .rm{font-size:12px;color:var(--blue-deep);font-weight:800;text-align:right;}
.report-empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:12.5px;}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;}
@media(max-width:980px){
  .report-kpi-grid{grid-template-columns:repeat(2,1fr);}
  .report-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .report-kpi-grid{grid-template-columns:1fr 1fr;}
  .report-date{width:100%;}
}

@media(max-width:980px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .status-pulse-grid{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .login-visual{display:none;}
}
</style>
<style id="printReportStyle">
@media print{
  .conn-strip,.sidebar,.topbar .report-actions,.report-filter .report-tabs,.report-date,.toast{display:none!important;}
  .shell{display:block!important;min-height:auto!important;}
  .main{padding:0!important;}
  .panel,.report-kpi{box-shadow:none!important;break-inside:avoid;}
  .report-grid{grid-template-columns:1.2fr 1fr!important;}
  body{background:#fff!important;}
}
</style>
</head>
<body>
<div class="conn-strip">🔗 ระบบหลังบ้านพนักงาน — เชื่อมข้อมูลแบบเรียลไทม์กับ <b>ระบบหน้าบ้านลูกค้า (customer.html)</b> — เปิดทั้งสองไฟล์จากโฟลเดอร์เดียวกันด้วย Chrome/Edge เพื่อให้ข้อมูลซิงก์กัน</div>
<div id="root"></div>

<script>
const CATS = [
  {k:'notebook',lb:'คอมพิวเตอร์/โน้ตบุ๊ก',kw:'laptop'},{k:'phone',lb:'โทรศัพท์/แท็บเล็ต',kw:'smartphone'},{k:'accessory',lb:'อุปกรณ์เสริม',kw:'computer-accessories'},
  {k:'monitor',lb:'จอภาพ',kw:'computer-monitor'},{k:'gaming',lb:'อุปกรณ์ Gaming',kw:'gaming-setup'},{k:'printer',lb:'Printer',kw:'printer'},
  {k:'network',lb:'Network',kw:'wifi-router'},{k:'storage',lb:'Storage',kw:'hard-drive'},{k:'other',lb:'อื่น ๆ',kw:'electronics'},
];
const STATUS_META = {
  instock:{label:'มีสินค้าที่สาขาตรัง',dot:'🟢',cls:'st-instock'},
  incoming:{label:'กำลังจัดส่งมายังสาขาตรัง',dot:'🟡',cls:'st-incoming'},
  main:{label:'มีสินค้าที่บริษัทหลัก',dot:'🔵',cls:'st-main'},
  other:{label:'มีสินค้าที่สาขาอื่น',dot:'🟠',cls:'st-other'},
  out:{label:'สินค้าหมด',dot:'🔴',cls:'st-out'},
};
const STMAP = {instock:'#E9F9EF',incoming:'#FDF3E2',main:'#EBF2FF',other:'#FCEEE1',out:'#FDEBEB'};
const STCOLOR = {instock:'#16A34A',incoming:'#D98A0B',main:'#2F6BFF',other:'#B8590C',out:'#DC2626'};
const PRODUCT_KEYWORDS = {
  'NB-AS001':'laptop-computer','NB-LN002':'laptop','NB-AC003':'gaming-laptop',
  'PH-SM004':'smartphone','PH-XM005':'smartphone-phone','TB-IP006':'tablet-ipad',
  'AC-LG007':'computer-mouse','AC-KB008':'mechanical-keyboard','MN-DL009':'computer-monitor',
  'MN-SM010':'gaming-monitor','GM-RZ011':'gaming-mouse','GM-HS012':'gaming-headset',
  'PR-EP013':'printer','PR-CN014':'office-printer','NW-TL015':'wifi-router',
  'ST-SS016':'ssd-drive','ST-WD017':'external-harddrive','AC-CB018':'power-bank',
  'MN-VW019':'computer-monitor','OT-UP020':'power-supply',
};
const PRODUCT_IMAGES = {
  // Product photos from manufacturer/store product listings (direct image URLs)
  'NB-AS001':'https://m.media-amazon.com/images/I/71ovxIPny7L._AC_SL1500_.jpg',
  'NB-LN002':'https://m.media-amazon.com/images/I/719C6bJv8jL._AC_UL320_.jpg',
  'NB-AC003':'https://mediamart.vn/images/mediamart/2024/09/12/laptop-acer-aspire-7-gaming-a715-59g-73lb.jpg',
  'PH-SM004':'https://commons.wikimedia.org/wiki/Special:FilePath/Samsung_Galaxy_A55_5G_2024.jpg',

  'AC-LG007':'https://www.logitech.com/content/dam/logitech/en/products/mice/mx-master-3s-wireless-mouse/mx-master-3s-top-view-black.png',
  'AC-KB008':'https://m.media-amazon.com/images/I/71qJ9pQKS2L._AC_SL1500_.jpg',
  'MN-DL009':'https://i.dell.com/is/image/DellContent//content/dam/ss2/product-images/peripherals/monitors/s-series/s2421hn/media-gallery/monitor-s2421hn-gallery-1.psd?fmt=png-alpha&pscan=auto&scl=1&wid=800&hei=800&qlt=100,1&resMode=sharp2&size=800,800',
  'MN-SM010':'https://media.ldlc.com/r1600/ld/products/00/06/09/06/66/87/SCG552_0001.jpg',

  'ST-SS016':'https://m.media-amazon.com/images/I/81BIRmPUAgL._AC_SL1500_.jpg',
};
function hashCode(str){
  let hash = 0;
  str = String(str ?? '');
  for(let i = 0; i < str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function pimg(keyword, width=800, height=500){
  const q = encodeURIComponent(String(keyword || 'technology').replace(/-/g,' '));
  return `https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=${width}&h=${height}&q=80`;
}

function limg(keyword, width=500, height=400, seed=1){
  const key = encodeURIComponent(`${String(keyword || 'technology')}-${seed}`);

async function fileToProductImage(file){
  if(!file || !file.type.startsWith('image/')) throw new Error('กรุณาเลือกไฟล์รูปภาพ');
  if(file.size > 8*1024*1024) throw new Error('รูปภาพมีขนาดใหญ่เกิน 8 MB');
  const data = await new Promise((resolve,reject)=>{
    const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
  });
  const img = await new Promise((resolve,reject)=>{
    const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=data;
  });
  const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.78);
}

function reportDateValue(o){
  if(!o || !o.created) return '';
  const m=String(o.created).match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
}
function reportDateLabel(d,mode){
  if(mode==='day') return d.slice(8,10)+'/'+d.slice(5,7);
  if(mode==='week') return d.slice(8,10)+'/'+d.slice(5,7);
  return d.slice(5,7)+'/'+d.slice(0,4);
}
function reportRange(mode,from,to){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let a,b;
  if(mode==='custom' && from && to){ a=new Date(from+'T00:00:00'); b=new Date(to+'T23:59:59'); }
  else if(mode==='day'){ a=today; b=new Date(today.getTime()+86400000-1); }
  else if(mode==='week'){
    const day=today.getDay();
    const diff=day===0?6:day-1;
    a=new Date(today); a.setDate(today.getDate()-diff);
    b=new Date(a); b.setDate(a.getDate()+6); b.setHours(23,59,59,999);
  } else {
    a=new Date(today.getFullYear(),today.getMonth(),1);
    b=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59);
  }
  return {a,b,from:a.toISOString().slice(0,10),to:b.toISOString().slice(0,10)};
}
function reportData(){
  const mode=admin.reportMode||'month';
  const range=reportRange(mode,admin.reportFrom,admin.reportTo);
  const orders=DB.orders.filter(o=>{
    const d=reportDateValue(o);
    if(!d) return false;
    const x=new Date(d+'T12:00:00');
    return x>=range.a && x<=range.b && o.status!=='ยกเลิก';
  });
  const total=orders.reduce((sum,o)=>sum+Number(o.total||0),0);
  const qty=orders.reduce((sum,o)=>sum+(o.items||[]).reduce((n,i)=>n+Number(i.qty||0),0),0);
  const byProduct={};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    const key=i.code||i.name||'ไม่ระบุ';
    if(!byProduct[key]) byProduct[key]={name:i.name||key,qty:0,sales:0};
    byProduct[key].qty+=Number(i.qty||0);
    byProduct[key].sales+=Number(i.qty||0)*Number(i.price||0);
  }));
  let labels=[], values=[];
  if(mode==='day'){
    labels=['วันนี้']; values=[total];
  }else if(mode==='week'){
    for(let i=0;i<7;i++){
      const d=new Date(range.a); d.setDate(range.a.getDate()+i);
      const key=d.toISOString().slice(0,10);
      labels.push(key); values.push(orders.filter(o=>reportDateValue(o)===key).reduce((s,o)=>s+Number(o.total||0),0));
    }
  }else if(mode==='month'){
    const days=new Date(range.a.getFullYear(),range.a.getMonth()+1,0).getDate();
    for(let i=1;i<=days;i++){
      const key=range.from.slice(0,8)+String(i).padStart(2,'0');
      labels.push(key); values.push(orders.filter(o=>reportDateValue(o)===key).reduce((s,o)=>s+Number(o.total||0),0));
    }
  }else{
    const cur=new Date(range.a.getFullYear(),range.a.getMonth(),1);
    while(cur<=range.b){
      const y=cur.getFullYear(),m=cur.getMonth();
      const val=orders.filter(o=>{const d=new Date(reportDateValue(o)+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m;}).reduce((s,o)=>s+Number(o.total||0),0);
      labels.push(String(m+1).padStart(2,'0')+'/'+y); values.push(val);
      cur.setMonth(cur.getMonth()+1);
    }
  }
  return {mode,range,orders,total,qty,byProduct,labels,values};
}
function reportModeLabel(mode){
  return {day:'รายวัน',week:'รายสัปดาห์',month:'รายเดือน',year:'รายปี',custom:'กำหนดช่วงเวลา'}[mode]||'รายเดือน';
}

    <div class="field"><label>ที่ตั้ง</label><input value="ข้างห้างโรบินสัน ตรัง" disabled></div>
    <div class="field"><label>เวลาเปิดทำการ</label><input value="09:00 – 18:00 น." disabled></div>
    <div class="field"><label>ค่าบริการตรวจสอบด้วยรหัสสินค้า</label><input value="฿10 ต่อครั้ง" disabled></div>
  </div><div style="font-size:11.5px;color:var(--muted);margin-top:18px;">* หน้าตั้งค่านี้เป็นตัวอย่างสำหรับต้นแบบระบบ (Prototype) เท่านั้น</div></div>`;
}

function updateQueueBadge(){ /* re-render already reflects queue count in sidebar */ }

function bindEvents(){
  const loginForm=document.getElementById('loginForm');
  if(loginForm) loginForm.onsubmit=(e)=>{ e.preventDefault(); const fd=new FormData(loginForm);
    if(fd.get('user')==='admin' && fd.get('pass')==='admin123'){ loggedIn=true; render(); }
    else document.getElementById('loginErr').style.display='block';
  };
  const logoutBtn=document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.onclick=()=>{loggedIn=false; admin.page='dashboard'; render();};
  document.querySelectorAll('[data-apage]').forEach(el=>el.onclick=()=>{admin.page=el.dataset.apage; render();});
  document.querySelectorAll('[data-report-mode]').forEach(el=>el.onclick=()=>{
    admin.reportMode=el.dataset.reportMode;
    if(admin.reportMode!=='custom'){admin.reportFrom='';admin.reportTo='';}
    render();
  });
  const applyReport=document.getElementById('applyReport');
  if(applyReport) applyReport.onclick=()=>{
    admin.reportFrom=document.getElementById('reportFrom').value;
    admin.reportTo=document.getElementById('reportTo').value;
    if(!admin.reportFrom||!admin.reportTo){toast('กรุณาเลือกวันที่ให้ครบ');return;}
    if(admin.reportFrom>admin.reportTo){toast('วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด');return;}
    render();
  };
  const printReport=document.getElementById('printReport');
  if(printReport) printReport.onclick=()=>window.print();
  const exportReport=document.getElementById('exportReport');
  if(exportReport) exportReport.onclick=()=>{
    const d=reportData();
    const rows=[['รหัสคำสั่งซื้อ','วันที่','รายการสินค้า','จำนวนสินค้า','ยอดขาย','สถานะ']];
    d.orders.forEach(o=>rows.push([o.id,reportDateValue(o),(o.items||[]).map(i=>`${i.name} x${i.qty}`).join(' | '),(o.items||[]).reduce((n,i)=>n+Number(i.qty||0),0),Number(o.total||0),o.status]));
    const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`sales-report-${d.range.from}-to-${d.range.to}.csv`; a.click(); URL.revokeObjectURL(a.href);
    toast('ส่งออกไฟล์รายงานแล้ว');
  };


  const addBtn=document.getElementById('addProductBtn'); if(addBtn) addBtn.onclick=()=>{admin.editingProduct=null; admin.pendingProductImage=''; admin.showProductModal=true; render();};
  document.querySelectorAll('[data-editprod]').forEach(el=>el.onclick=()=>{admin.editingProduct=DB.products.find(p=>p.id===el.dataset.editprod); admin.pendingProductImage=''; admin.showProductModal=true; render();});
  document.querySelectorAll('[data-delprod]').forEach(el=>el.onclick=async()=>{DB.products=DB.products.filter(p=>p.id!==el.dataset.delprod); await saveDB(); toast('ลบสินค้าแล้ว'); render();});
  const closeProdModal=document.getElementById('closeProdModal'); if(closeProdModal) closeProdModal.onclick=()=>{admin.showProductModal=false; render();};
  const closeProdModal2=document.getElementById('closeProdModal2'); if(closeProdModal2) closeProdModal2.onclick=()=>{admin.showProductModal=false; render();};
  const productImageFile=document.getElementById('productImageFile');
  if(productImageFile) productImageFile.onchange=async()=>{
    const file=productImageFile.files?.[0]; if(!file) return;
    try{
      admin.pendingProductImage=await fileToProductImage(file);
      const preview=document.getElementById('productImagePreview'); if(preview) preview.src=admin.pendingProductImage;
      toast('เลือกรูปสินค้าแล้ว — กดบันทึกเพื่อใช้รูปนี้');
    }catch(e){ admin.pendingProductImage=''; productImageFile.value=''; toast(e.message||'ไม่สามารถอ่านรูปภาพได้'); }
  };
  const saveProdBtn=document.getElementById('saveProdBtn');
  if(saveProdBtn) saveProdBtn.onclick=async()=>{
    const fd=new FormData(document.getElementById('prodForm'));
    const newImage=admin.pendingProductImage || (admin.editingProduct?.image) || productImg(fd.get('code'),fd.get('category'));
    if(admin.editingProduct){ Object.assign(admin.editingProduct,{image:newImage,code:fd.get('code'),name:fd.get('name'),category:fd.get('category'),price:Number(fd.get('price')),stock:Number(fd.get('stock')),location:fd.get('location'),status:fd.get('status')}); }
    else { DB.products.push({id:uid('P'), image:newImage, code:fd.get('code'), name:fd.get('name'), category:fd.get('category'), price:Number(fd.get('price')), stock:Number(fd.get('stock')), location:fd.get('location')||'-', status:fd.get('status')}); }
    await saveDB(); admin.pendingProductImage=''; admin.showProductModal=false; toast('บันทึกสินค้าและรูปภาพเรียบร้อย'); render();
  };
  document.querySelectorAll('.statusSelect').forEach(el=>el.onchange=async()=>{const p=DB.products.find(x=>x.id===el.dataset.id); if(p){p.status=el.value; await saveDB(); toast('อัปเดตสถานะสินค้าแล้ว'); render();}});
  const prodSearch=document.getElementById('prodSearch'); if(prodSearch){ prodSearch.oninput=()=>{admin.productSearch=prodSearch.value; render(); document.getElementById('prodSearch').focus();}; }

  document.querySelectorAll('.orderStatusSelect').forEach(el=>el.onchange=async()=>{const o=DB.orders.find(x=>x.id===el.dataset.id); if(o){o.status=el.value; await saveDB(); toast('อัปเดตสถานะคำสั่งซื้อแล้ว'); render();}});
  document.querySelectorAll('.resStatusSelect').forEach(el=>el.onchange=async()=>{const r=DB.reservations.find(x=>x.id===el.dataset.id); if(r){r.status=el.value; await saveDB(); toast('อัปเดตสถานะการจองแล้ว'); render();}});
  document.querySelectorAll('.checkStatusSelect').forEach(el=>el.onchange=async()=>{const c=DB.checkRequests.find(x=>x.id===el.dataset.id); if(c){c.status=el.value; await saveDB(); toast('อัปเดตคำขอตรวจสอบแล้ว'); render();}});
  document.querySelectorAll('.tickStatusSelect').forEach(el=>el.onchange=async()=>{const t=DB.tickets.find(x=>x.id===el.dataset.id); if(t){t.status=el.value; await saveDB(); toast('อัปเดตสถานะคำร้องแล้ว'); render();}});

  const refreshMonitor=document.getElementById('refreshMonitor');
  if(refreshMonitor) refreshMonitor.onclick=async()=>{DB.systemStatus.users=20+Math.floor(Math.random()*80); DB.systemStatus.requests=100+Math.floor(Math.random()*400); DB.systemStatus.resp=120+Math.floor(Math.random()*300); await saveDB(); toast('รีเฟรชสถานะระบบแล้ว'); render();};

  // live chat
  document.querySelectorAll('[data-cqtoggle]').forEach(el=>el.onclick=()=>{admin.openChatId = admin.openChatId===el.dataset.cqtoggle ? null : el.dataset.cqtoggle; render(); setTimeout(()=>{const m=document.getElementById('cqmsgs-'+admin.openChatId); if(m) m.scrollTop=m.scrollHeight;},30);});
  document.querySelectorAll('[data-cqsend]').forEach(el=>el.onclick=()=>sendCqReply(el.dataset.cqsend));
  document.querySelectorAll('[data-cqinput]').forEach(el=>el.onkeydown=(e)=>{ if(e.key==='Enter') sendCqReply(el.dataset.cqinput); });
  document.querySelectorAll('[data-cqclose]').forEach(el=>el.onclick=async()=>{
    const s=DB.chatSessions.find(x=>x.id===el.dataset.cqclose);
    if(s){ s.status='closed'; s.messages.push({from:'system', text:'เจ้าหน้าที่ปิดการสนทนาแล้ว', time:nowTime()}); await saveDB(); toast('ปิดการสนทนาแล้ว'); render(); }
  });
  const refreshChat=document.getElementById('refreshChat'); if(refreshChat) refreshChat.onclick=async()=>{await loadDB(); render();};
}

async function sendCqReply(sid){
  const input = document.querySelector(`[data-cqinput="${sid}"]`);
  if(!input) return;
  const v = input.value.trim(); if(!v) return;
  const s = DB.chatSessions.find(x=>x.id===sid);
  if(!s) return;
  s.status='active';
  s.messages.push({from:'staff', text:v, time:nowTime()});
  await saveDB();
  admin.openChatId = sid;
  render();
  setTimeout(()=>{const m=document.getElementById('cqmsgs-'+sid); if(m) m.scrollTop=m.scrollHeight; const i=document.querySelector(`[data-cqinput="${sid}"]`); if(i) i.focus();},30);
}

// live poll for new customer messages / queue changes while on the live chat page
setInterval(async ()=>{
  if(loggedIn && admin.page==='livechat'){
    const before = JSON.stringify(DB.chatSessions);
    await loadDB();
    const after = JSON.stringify(DB.chatSessions);
    if(before!==after) render();
  } else if(loggedIn){
    await loadDB(); // keep KPIs / queue badge fresh in background
  }
}, 4000);

(async function init(){ await loadDB(); render(); })();
</script>
