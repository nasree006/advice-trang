<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advice Trang Smart Service — หน้าบ้านลูกค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#081B32; --navy2:#0E2A4D; --blue:#2F6BFF; --blue-deep:#1948D6; --sky:#EBF2FF; --cyan:#00C2D1;
  --ink:#10233F; --muted:#5C7089; --line:#E3EAF5; --paper:#FFFFFF; --bg:#F6F9FE;
  --ok:#16A34A; --ok-bg:#E9F9EF; --warn:#D98A0B; --warn-bg:#FDF3E2; --info:#2F6BFF; --info-bg:#EBF2FF;
  --other:#B8590C; --other-bg:#FCEEE1; --danger:#DC2626; --danger-bg:#FDEBEB;
  --gold:#C9A227; --gold-deep:#9C7D15; --gold-bg:#FBF3DC;
  --radius:18px; --shadow:0 10px 30px rgba(10,37,64,.09), 0 2px 6px rgba(10,37,64,.06);
  --shadow-lg:0 24px 60px rgba(8,27,50,.22);
}
.premium-tag{background:linear-gradient(120deg,var(--gold),#e6c65c);color:#4a3a06;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;box-shadow:0 3px 8px rgba(201,162,39,.35);}
.queue-banner{background:var(--sky);border:1px solid #c9dbf7;border-radius:12px;padding:10px 13px;font-size:11.5px;color:var(--blue-deep);text-align:center;margin-bottom:8px;font-weight:600;}
.msg.staff{background:linear-gradient(120deg,#12305c,#1948D6);color:#fff;align-self:flex-start;border-bottom-left-radius:4px;}
.msg.staff .lbl{font-size:9.5px;opacity:.75;display:block;margin-bottom:3px;letter-spacing:.3px;}
.order-code-box{background:linear-gradient(120deg,var(--navy),#123564);color:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:6px;}
.order-code-box .oc{font-family:'Kanit';font-size:22px;font-weight:800;letter-spacing:1px;color:var(--gold);margin:6px 0;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'IBM Plex Sans Thai','Kanit',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.display{font-family:'Kanit','IBM Plex Sans Thai',sans-serif;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
img{display:block;object-fit:cover;}
.hidden{display:none !important;}

/* connection strip */
.conn-strip{background:var(--navy);color:#9db6dd;font-size:11.5px;text-align:center;padding:6px 14px;letter-spacing:.2px;}
.conn-strip b{color:#7fd8e0;}

/* header */
header.site{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
.hwrap{max-width:1220px;margin:0 auto;padding:0 26px;display:flex;align-items:center;justify-content:space-between;height:72px;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand-badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Kanit';font-size:16px;box-shadow:0 6px 16px rgba(47,107,255,.35);}
.brand-text .t1{font-family:'Kanit';font-weight:700;font-size:17px;color:var(--navy);line-height:1.15;}
.brand-text .t2{font-size:10.5px;color:var(--muted);letter-spacing:.3px;}
.nav{display:flex;align-items:center;gap:2px;}
.nav button{background:none;border:none;color:var(--ink);font-size:14px;padding:10px 14px;border-radius:10px;font-weight:500;transition:.15s;}
.nav button:hover{background:var(--sky);color:var(--blue-deep);}
.nav button.active{background:var(--sky);color:var(--blue-deep);font-weight:700;}
.hicons{display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;transition:.15s;}
.icon-btn:hover{border-color:var(--blue);}
.icon-btn .cnt{position:absolute;top:-6px;right:-6px;background:var(--blue);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700;}
.cta-pill{background:linear-gradient(120deg,var(--navy),var(--blue-deep));color:#fff;border:none;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;box-shadow:0 8px 20px rgba(25,72,214,.3);}

main{max-width:1220px;margin:0 auto;padding:32px 26px 90px;}

/* HERO — photographic */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:460px;display:flex;align-items:center;margin-bottom:34px;box-shadow:var(--shadow-lg);}
.hero img.bgphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05);}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,18,36,.94) 20%,rgba(6,18,36,.75) 48%,rgba(8,25,50,.35) 78%);}
.hero-inner{position:relative;z-index:2;padding:52px 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;width:100%;}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#dfeaff;padding:6px 14px;border-radius:20px;margin-bottom:16px;}
.hero h1{font-size:35px;line-height:1.28;margin:0 0 12px;font-weight:700;color:#fff;}
.hero h1 span{color:var(--cyan);}
.hero p{font-size:14.5px;color:#c9d9f2;line-height:1.75;margin:0 0 24px;max-width:480px;}
.hero-search{background:#fff;border-radius:16px;padding:7px;display:flex;gap:7px;box-shadow:0 14px 38px rgba(0,0,0,.28);max-width:480px;}
.hero-search input{flex:1;border:none;outline:none;padding:12px 15px;font-size:14px;border-radius:11px;font-family:inherit;color:var(--ink);}
.hero-search button{background:var(--blue);color:#fff;border:none;padding:0 22px;border-radius:11px;font-weight:700;font-size:13.5px;}
.hero-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.ghost-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);}
.ghost-btn:hover{background:rgba(255,255,255,.22);}

.hero-widget{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:20px 22px;backdrop-filter:blur(10px);}
.hero-widget h4{margin:0 0 4px;font-size:12px;color:#bcd2f2;font-weight:500;letter-spacing:.3px;}
.hero-widget .pname{font-size:14.5px;font-weight:600;margin-bottom:16px;color:#fff;}
.mini-timeline{display:flex;flex-direction:column;}
.mt-step{display:flex;gap:11px;align-items:flex-start;position:relative;padding-bottom:17px;}
.mt-step:last-child{padding-bottom:0;}
.mt-step::before{content:"";position:absolute;left:7px;top:19px;bottom:-2px;width:2px;background:rgba(255,255,255,.22);}
.mt-step:last-child::before{display:none;}
.mt-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);flex:none;margin-top:1px;position:relative;z-index:1;}
.mt-step.done .mt-dot{background:var(--cyan);box-shadow:0 0 0 4px rgba(0,194,209,.28);}
.mt-step.current .mt-dot{background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.32);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.25);}50%{box-shadow:0 0 0 9px rgba(255,255,255,.06);}}
.mt-label{font-size:12.5px;color:#c9d9f2;line-height:1.35;}
.mt-step.done .mt-label,.mt-step.current .mt-label{color:#fff;font-weight:600;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 18px;}
.section-head h2{font-size:20px;margin:0;color:var(--navy);}
.section-head .sub{font-size:12.5px;color:var(--muted);}
.section-head .link{font-size:13px;color:var(--blue);font-weight:700;}

/* categories with photo */
.cat-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:12px;}
.cat-card{position:relative;border-radius:16px;overflow:hidden;height:98px;border:1px solid var(--line);transition:.2s;}
.cat-card img{width:100%;height:100%;filter:brightness(.55) saturate(1.1);transition:.3s;}
.cat-card:hover img{transform:scale(1.08);filter:brightness(.4);}
.cat-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);}
.cat-card .lb{position:absolute;left:9px;right:9px;bottom:8px;color:#fff;font-size:11px;font-weight:700;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.4);}
.cat-card.active{outline:2.5px solid var(--blue);outline-offset:-2.5px;}

.filters-bar{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}

/* product cards with real photo */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.p-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.22s;}
.p-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);border-color:#cfdff8;}
.p-thumb{height:150px;position:relative;overflow:hidden;background:var(--sky);}
.p-thumb img{width:100%;height:100%;transition:.4s;}
.p-card:hover .p-thumb img{transform:scale(1.09);}
.p-status-tag{position:absolute;top:11px;left:11px;font-size:10.5px;padding:5px 10px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px);}
.p-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:6px;flex:1;}
.p-code{font-size:10.5px;color:var(--muted);letter-spacing:.3px;}
.p-name{font-size:13.5px;font-weight:600;color:var(--navy);line-height:1.35;min-height:36px;}
.p-price{font-size:17px;font-weight:700;color:var(--blue-deep);font-family:'Kanit';}
.p-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
.p-actions{display:flex;gap:6px;margin-top:9px;}
.p-actions button{flex:1;padding:9px 6px;border-radius:9px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;transition:.15s;}
.p-actions .buy{background:var(--blue);color:#fff;border-color:var(--blue);}
.p-actions .buy:hover{background:var(--blue-deep);}
.p-actions button:not(.buy):hover{background:var(--sky);}

.st-instock{background:rgba(233,249,239,.92);color:var(--ok);}
.st-incoming{background:rgba(253,243,226,.92);color:var(--warn);}
.st-main{background:rgba(235,242,255,.92);color:var(--info);}
.st-other{background:rgba(252,238,225,.92);color:var(--other);}
.st-out{background:rgba(253,235,235,.92);color:var(--danger);}

.page-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow);}
.page-title{font-size:23px;color:var(--navy);margin:0 0 6px;}
.page-desc{font-size:13.5px;color:var(--muted);margin:0 0 24px;}

.check-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.check-tabs button{background:none;border:none;padding:11px 4px;margin-right:20px;font-size:14px;color:var(--muted);font-weight:700;border-bottom:2.5px solid transparent;}
.check-tabs button.active{color:var(--blue-deep);border-color:var(--blue);}
.check-form{display:flex;gap:10px;margin-bottom:8px;}
.check-form input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;}
.check-form button{background:var(--blue);color:#fff;border:none;padding:0 24px;border-radius:12px;font-weight:700;font-size:13.5px;}
.premium-note{display:flex;gap:9px;align-items:flex-start;background:var(--gold-bg);border:1px solid #e8d488;color:#6b551a;font-size:12.5px;padding:12px 15px;border-radius:12px;margin-top:11px;line-height:1.55;}
.result-box{margin-top:24px;border:1px solid var(--line);border-radius:16px;padding:22px;background:#fbfdff;}
.result-empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 10px;}
.timeline-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.branch-list{display:flex;flex-direction:column;gap:8px;margin:15px 0;}
.branch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;background:#fff;}
.h-timeline{display:flex;align-items:center;margin:24px 0;}
.h-step{flex:1;text-align:center;position:relative;}
.h-step .hd{width:28px;height:28px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;font-size:12px;font-weight:700;position:relative;z-index:1;}
.h-step.done .hd{background:var(--ok);}
.h-step.current .hd{background:var(--blue);box-shadow:0 0 0 6px var(--sky);}
.h-step:not(:last-child)::after{content:"";position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
.h-step.done:not(:last-child)::after{background:var(--ok);}
.h-step .hl{font-size:10.5px;color:var(--muted);}
.h-step.done .hl,.h-step.current .hl{color:var(--ink);font-weight:700;}
.action-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;}
.btn-outline{background:#fff;color:var(--blue-deep);border:1.5px solid var(--blue);padding:10px 19px;border-radius:12px;font-weight:700;font-size:13px;}
.btn-ghost-sm{background:var(--sky);color:var(--blue-deep);border:none;padding:10px 17px;border-radius:12px;font-weight:700;font-size:12.5px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;font-family:inherit;background:#fbfdff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
.field textarea{resize:vertical;min-height:90px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 11px;border-radius:20px;font-weight:700;}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.info-row{display:flex;gap:13px;padding:13px 0;border-bottom:1px dashed var(--line);}
.info-row .ic{width:36px;height:36px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;}
.info-row .tt{font-size:12px;color:var(--muted);}
.info-row .vv{font-size:13.5px;font-weight:700;color:var(--navy);}
.store-photo{margin-top:18px;height:190px;border-radius:16px;overflow:hidden;position:relative;}
.store-photo img{width:100%;height:100%;}
.store-photo .cap{position:absolute;left:14px;bottom:12px;color:#fff;font-size:11.5px;background:rgba(8,20,40,.55);padding:5px 11px;border-radius:20px;backdrop-filter:blur(4px);}

footer.site{background:var(--navy);color:#a9c0e0;margin-top:60px;padding:40px 26px 24px;}
.fwrap{max-width:1220px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;}
.f-brand{color:#fff;font-family:'Kanit';font-weight:700;font-size:16px;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
.f-sub{font-size:12px;line-height:1.65;max-width:300px;}
.cols{display:flex;gap:55px;}
footer.site h5{color:#fff;font-size:12.5px;margin:0 0 11px;}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;font-size:12px;}
.fbottom{max-width:1220px;margin:28px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;text-align:center;color:#7f97bd;}

.overlay{position:fixed;inset:0;background:rgba(6,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px);}
.modal{background:#fff;border-radius:22px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 34px 70px rgba(0,0,0,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:17px;color:var(--navy);}
.modal-close{background:var(--sky);border:none;width:32px;height:32px;border-radius:9px;font-size:14px;color:var(--muted);}
.modal-body{padding:24px 26px;}
.modal-foot{padding:17px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-photo{height:180px;border-radius:14px;overflow:hidden;margin-bottom:16px;}
.modal-photo img{width:100%;height:100%;}

.pay-summary{background:var(--sky);border-radius:14px;padding:17px;font-size:13px;margin-bottom:17px;}
.pay-row{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink);}
.pay-row.total{font-weight:700;border-top:1px dashed #b9d2f5;margin-top:7px;padding-top:11px;color:var(--blue-deep);font-size:15px;}
.pay-methods{display:flex;gap:10px;margin-bottom:17px;}
.pay-m{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:13px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.pay-m.active{border-color:var(--blue);background:var(--sky);color:var(--blue-deep);}
.qr-box{width:160px;height:160px;margin:10px auto;background:repeating-linear-gradient(0deg,#0A2540 0 4px,transparent 4px 8px),repeating-linear-gradient(90deg,#0A2540 0 4px,transparent 4px 8px);background-color:#fff;border:1px solid var(--line);border-radius:12px;}
.pay-processing{text-align:center;padding:32px 10px;}
.spinner{width:40px;height:40px;border:4px solid var(--sky);border-top-color:var(--blue);border-radius:50%;margin:0 auto 17px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pay-success{text-align:center;padding:22px 10px;}
.check-ic{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;}

.chat-fab{position:fixed;bottom:28px;right:28px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;box-shadow:0 12px 30px rgba(47,107,255,.42);font-size:25px;z-index:80;display:flex;align-items:center;justify-content:center;}
.chat-fab .dot{position:absolute;top:2px;right:2px;width:13px;height:13px;background:#ff5a5a;border-radius:50%;border:2px solid #fff;}
.chat-win{position:fixed;bottom:100px;right:28px;width:374px;max-width:92vw;height:530px;max-height:76vh;background:#fff;border-radius:20px;box-shadow:0 24px 56px rgba(6,15,30,.28);z-index:81;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);}
.chat-head{background:linear-gradient(120deg,var(--navy),var(--blue-deep));color:#fff;padding:17px 19px;display:flex;align-items:center;gap:11px;}
.chat-head .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px;}
.chat-head .tt{font-size:13.5px;font-weight:700;}
.chat-head .ss{font-size:11px;color:#cfe0fb;display:flex;align-items:center;gap:5px;}
.chat-head .ss::before{content:"";width:6px;height:6px;background:#3ee06b;border-radius:50%;}
.chat-head .x{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:27px;height:27px;border-radius:9px;}
.chat-body{flex:1;overflow-y:auto;padding:17px;display:flex;flex-direction:column;gap:11px;background:#F7FAFF;}
.msg{max-width:82%;padding:11px 14px;border-radius:15px;font-size:12.8px;line-height:1.6;white-space:pre-line;}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg.sys{align-self:center;font-size:11px;color:var(--muted);background:transparent;}
.quick-menu{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qm-btn{background:#fff;border:1px solid var(--line);color:var(--blue-deep);font-size:11.5px;padding:8px 12px;border-radius:20px;font-weight:600;}
.qm-btn:hover{background:var(--sky);}
.chat-typing{display:flex;gap:4px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:15px;align-self:flex-start;width:fit-content;}

function hashCode(str){
  let hash = 0;
  const s = String(str || '');
  for(let i = 0; i < s.length; i++){
    hash = ((hash << 5) - hash) + s.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function limg(keyword, width=500, height=400, seed=1){
  const kw = encodeURIComponent(String(keyword || 'electronics').replace(/\s+/g, ','));
  const lock = Math.abs(Number(seed) || hashCode(keyword || 'electronics')) % 10000;
  return `https://loremflickr.com/${width}/${height}/${kw}?lock=${lock}`;
}

function pimg(keyword, width=800, height=500){
  return limg(keyword, width, height, hashCode(keyword || 'electronics'));
}

function productImg(code,category){ return PRODUCT_IMAGES[code] || limg(PRODUCT_KEYWORDS[code]||CATS.find(c=>c.k===category)?.kw||'electronics', 500,400, hashCode(code)); }

    ['OT-UP020','UPS APC 650VA','other',1990],

  const statuses = ['instock','instock','incoming','main','other','instock','out','main','instock','incoming'];
  return names.map((n,i)=>({
    id:'P'+(i+1).toString().padStart(3,'0'),
    code:n[0], name:n[1], category:n[2], price:n[3],
    image: productImg(n[0], n[2]),
    status: statuses[i%statuses.length],
    stock: statuses[i%statuses.length]==='instock' ? (3+(i%6)) : 0,
    location: 'ชั้น '+(1+(i%3))+' โซน '+String.fromCharCode(65+(i%4)),
  }));
}
const DEFAULTS = {
  products: seedProducts(),
  reservations: [], checkRequests: [], tickets: [], chatlogs: [], errorlogs: [], orders: [], chatSessions: [],
  systemStatus: {level:'ok', users: 47, requests: 312, errors: 2, resp: 180},
};
const KEY = 'advice_trang_v1';
let DB = null;
function loadDBSync(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    DB = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULTS));
  }catch(e){ DB = JSON.parse(JSON.stringify(DEFAULTS)); }
  // migrate: ensure products carry real image field + new collections exist
  DB.products = (DB.products||[]).map(p=> p.image && p.image.includes('loremflickr') ? p : {...p, image: productImg(p.code,p.category)});
  DB.orders = DB.orders||[]; DB.chatSessions = DB.chatSessions||[];
  DB.reservations = DB.reservations||[]; DB.checkRequests = DB.checkRequests||[]; DB.tickets = DB.tickets||[];
  DB.chatlogs = DB.chatlogs||[]; DB.errorlogs = DB.errorlogs||[];
  if(!raw) saveDBSync();
}
function saveDBSync(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ console.error('save failed',e); } }
async function loadDB(){ loadDBSync(); }
async function saveDB(){ saveDBSync(); }
function fmt(n){ return Number(n).toLocaleString('th-TH'); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,7).toUpperCase(); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function nowTime(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }

// real-time sync across the two separate HTML files (same browser, same folder / origin)
window.addEventListener('storage', (e)=>{ if(e.key===KEY){ loadDBSync(); render(); } });

function timelineForStatus(status){
  const stepsLabel=['บริษัทหลัก','กำลังจัดส่ง','ศูนย์กระจายสินค้า','Advice สาขาตรัง','พร้อมรับสินค้า'];
  let doneUpto = status==='instock'?4:status==='incoming'?2:status==='main'?0:-1;
  if(status==='out'||status==='other') doneUpto=-1;
  return `<div class="h-timeline">${stepsLabel.map((s,i)=>{const cls=i<doneUpto?'done':i===doneUpto?'current':'';return `<div class="h-step ${cls}"><div class="hd">${i<doneUpto?'✓':i+1}</div><div class="hl">${s}</div></div>`;}).join('')}</div>`;
}

  const push=(m)=>cust.chatMessages.push(m);
  if(key==='check'||key==='where'||key==='ask'){
    push({role:'user', text: key==='where'?'สินค้าอยู่ที่ไหน':(key==='ask'?'สอบถามสินค้า':'ตรวจสอบสินค้า')}); render();
    cust.chatBusy=true; render(); await sleep(700); cust.chatBusy=false;
    push({role:'bot', text:'ได้ครับ กรุณาระบุชื่อสินค้า หรือรหัสสินค้าที่ต้องการตรวจสอบ'});
    cust.chatFlow='awaiting_product'; render();
  } else if(key==='buy'){
    push({role:'user', text:'ซื้อสินค้า'}); push({role:'bot', text:'เชิญเลือกดูสินค้าและกดปุ่ม "ซื้อ" ที่การ์ดสินค้าได้เลยครับ ผมพาไปหน้าสินค้าให้นะครับ'}); render();
    setTimeout(()=>{cust.chatOpen=false; setCustPage('products');},900);
  } else if(key==='reserve'){
    push({role:'user', text:'จองสินค้า'}); push({role:'bot', text:'เดี๋ยวผมพาไปหน้าแบบฟอร์มจองสินค้าให้ครับ'}); render();
    setTimeout(()=>{cust.chatOpen=false; setCustPage('reserve');},900);
  } else if(key==='staff'){
    push({role:'user', text:'ติดต่อเจ้าหน้าที่'}); render();
    cust.chatBusy=true; render(); await sleep(800); cust.chatBusy=false;
    push({role:'bot', text:'ได้ครับ ผมจะส่งต่อให้เจ้าหน้าที่ทันที'}); render();
    await escalateToStaff();
  } else if(key==='home'){
    push({role:'user', text:'กลับเมนูหลัก'}); push({role:'bot', text:'กลับสู่เมนูหลักครับ ต้องการให้ช่วยอะไรเพิ่มเติมไหมครับ'});
    push({type:'quick', options:[{key:'check',label:'🔎 ตรวจสอบสินค้า'},{key:'buy',label:'🛒 ซื้อสินค้า'},{key:'reserve',label:'📌 จองสินค้า'},{key:'staff',label:'👨‍💼 ติดต่อเจ้าหน้าที่'},{key:'end',label:'❌ จบบทสนทนา'}]});
    render();
  } else if(key==='end'){
    push({role:'user', text:'จบบทสนทนา'}); push({role:'bot', text:'ขอบคุณที่ใช้บริการ Advice สาขาตรังครับ หากต้องการสอบถามเพิ่มเติม สามารถกลับมาใช้บริการได้ตลอดครับ 🙏'});
    DB.chatlogs.push({id:uid('CH'), time:nowTime(), topic:'จบบทสนทนา', outcome:'ลูกค้าปิดแชท'}); saveDB(); render();
  }
}
async function chatHandleProductQuery(text){
  const push=(m)=>cust.chatMessages.push(m);
  push({role:'user', text}); cust.chatFlow=null; render();
  cust.chatBusy=true; render(); await sleep(900); cust.chatBusy=false;
  const found = DB.products.find(p=>p.name.toLowerCase().includes(text.toLowerCase())||p.code.toLowerCase()===text.toLowerCase());
  push({role:'bot', text:'กำลังตรวจสอบข้อมูลสินค้า...'}); render(); await sleep(600);
  if(found){
    const inTrang=found.status==='instock', atMain=found.status==='main'||found.status==='incoming', atOther=found.status==='other';
    push({role:'bot', text:`พบสินค้า: ${found.name}\n\nAdvice สาขาตรัง: ${inTrang?'มีสินค้า':'ไม่มี'}\nบริษัทหลัก: ${atMain?'มีสินค้า':'ไม่มี'}\nAdvice สาขาอื่น: ${atOther?'มีสินค้า':'ไม่มี'}\n\n${inTrang?'พร้อมให้บริการที่สาขาตรังเลยครับ':'ต้องการให้ตรวจสอบการนำสินค้ามาที่สาขาตรังหรือไม่?'}`});
    push({type:'quick', options: inTrang?[{key:'buy',label:'ซื้อสินค้า'},{key:'reserve',label:'จองสินค้า'},{key:'home',label:'กลับเมนูหลัก'}]:[{key:'reserve',label:'จองสินค้า'},{key:'staff',label:'สอบถามเจ้าหน้าที่'},{key:'home',label:'กลับเมนูหลัก'}]});
    DB.chatlogs.push({id:uid('CH'), time:nowTime(), topic:'ถามสถานะสินค้า: '+found.name, outcome: inTrang?'พบสินค้าในสาขา':'เสนอจอง/ส่งต่อเจ้าหน้าที่'});
  } else {
    push({role:'bot', text:'ไม่พบสินค้าที่ตรงกับคำค้นหาครับ ลองตรวจสอบชื่อ/รหัสสินค้าอีกครั้ง หรือให้ผมส่งต่อให้เจ้าหน้าที่ช่วยตรวจสอบได้ครับ'});
    push({type:'quick', options:[{key:'staff',label:'ให้เจ้าหน้าที่ช่วยตรวจสอบ'},{key:'home',label:'กลับเมนูหลัก'}]});
    DB.chatlogs.push({id:uid('CH'), time:nowTime(), topic:'ถามสินค้าที่ไม่พบข้อมูล', outcome:'ส่งต่อเจ้าหน้าที่'});
  }
  saveDB(); render();
}
function scrollChatBottom(){ const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight; }

async function escalateToStaff(){
  const sid = uid('CS');
  const session = {id:sid, customerName:'ลูกค้าเว็บไซต์ #'+sid.slice(-4), messages:[
    {from:'system', text:'ลูกค้าเริ่มการสนทนาสดและขอเชื่อมต่อเจ้าหน้าที่ เวลาทำการ 09:00–18:00 น.', time:nowTime()}
  ], status:'queued', createdAt:new Date().toISOString()};
  DB.chatSessions.push(session);
  DB.chatlogs.push({id:uid('CH'), time:nowTime(), topic:'ขอเชื่อมต่อเจ้าหน้าที่ (Live Chat)', outcome:'เข้าคิว '+sid});
  await saveDB();
  cust.liveSessionId = sid;
  render();
}
async function sendLiveMessage(text){
  const session = DB.chatSessions.find(s=>s.id===cust.liveSessionId);
  if(!session) return;
  session.messages.push({from:'customer', text, time:nowTime()});
  await saveDB();
  render(); scrollChatBottom();
}
// live chat polling: refresh from shared storage while a live session is open
setInterval(async ()=>{
  if(cust.chatOpen && cust.liveSessionId){
    const before = JSON.stringify((DB.chatSessions||[]).find(s=>s.id===cust.liveSessionId));
    await loadDB();
    const after = JSON.stringify((DB.chatSessions||[]).find(s=>s.id===cust.liveSessionId));
    if(before!==after){ render(); scrollChatBottom(); }
  }
}, 3000);

function setCustPage(p){ cust.page=p; window.scrollTo({top:0,behavior:'smooth'}); render(); }

function render(){
  document.getElementById('root').innerHTML = `
  ${siteHeader()}
  <main>${
    cust.page==='home'?pageHome():
    cust.page==='products'?pageProducts():
    cust.page==='check'?pageCheck():
    cust.page==='reserve'?pageReserve():
    cust.page==='contact'?pageContact():
    cust.page==='cart'?pageCart(): pageHome()
  }</main>
  ${siteFooter()}
  ${cust.modalProduct?productModal():''}
  ${cust.pendingPayment?paymentModal():''}
  ${cust.checkoutInfo?checkoutModal():''}
  ${chatWidgetHtml()}
  `;
  bindEvents();
}

function runCheck(query,premium){
  const found = DB.products.find(p=>p.name.toLowerCase().includes(query.toLowerCase())||p.code.toLowerCase()===query.toLowerCase());
  if(found) cust.checkResult={product:found,premium,queryText:query};
  else cust.checkResult={notFound:true,queryText:query};
  render();
  document.querySelector('.result-box')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function runOrderTrack(query){
  const q = query.trim().toUpperCase();
  const order = DB.orders.find(o=>o.id.toUpperCase()===q);
  const resv = DB.reservations.find(r=>r.id.toUpperCase()===q);
  if(order) cust.orderTrackResult={type:'order', data:order};
  else if(resv) cust.orderTrackResult={type:'reservation', data:resv};
  else cust.orderTrackResult={notFound:true};
  render();
  document.querySelector('.result-box')?.scrollIntoView({behavior:'smooth',block:'center'});
}

function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>setCustPage(el.dataset.nav));
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{cust.activeCategory=el.dataset.cat==='all'?null:el.dataset.cat; setCustPage('products');});
  const heroBtn=document.getElementById('heroSearchBtn'); if(heroBtn) heroBtn.onclick=()=>{cust.search=document.getElementById('heroSearchInput').value; setCustPage('products');};
  const heroInput=document.getElementById('heroSearchInput'); if(heroInput) heroInput.onkeydown=(e)=>{if(e.key==='Enter'){cust.search=heroInput.value; setCustPage('products');}};
  const prodSearch=document.getElementById('prodSearchInput'); if(prodSearch){ prodSearch.oninput=()=>{cust.search=prodSearch.value; render(); document.getElementById('prodSearchInput').focus();}; }
  const openChatHero=document.getElementById('openChatFromHero'); if(openChatHero) openChatHero.onclick=()=>{cust.chatOpen=true; if(cust.chatMessages.length===0) initChat(); render();};

  document.querySelectorAll('[data-act="detail"]').forEach(el=>el.onclick=()=>{cust.modalProduct=DB.products.find(p=>p.id===el.dataset.id); render();});
  document.querySelectorAll('[data-act="buy"]').forEach(el=>el.onclick=()=>{const p=DB.products.find(x=>x.id===el.dataset.id); if(!p)return; cust.cart.push({...p,qty:1}); cust.modalProduct=null; toast('เพิ่ม "'+p.name+'" ลงตะกร้าแล้ว'); render();});
  document.querySelectorAll('[data-act="reserve"]').forEach(el=>el.onclick=()=>{cust.selectedProduct=el.dataset.id; cust.modalProduct=null; setCustPage('reserve');});
  document.querySelectorAll('[data-act="reserveFromCheck"]').forEach(el=>el.onclick=()=>setCustPage('reserve'));
  document.querySelectorAll('[data-act="requestcheck"]').forEach(el=>el.onclick=async()=>{
    DB.checkRequests.push({id:uid('CR'), product:cust.checkResult?.queryText||'ไม่ทราบชื่อสินค้า', name:'ลูกค้าเว็บไซต์', phone:'-', status:'รอตรวจสอบ', created:new Date().toISOString().slice(0,10)});
    await saveDB(); toast('ส่งคำขอให้เจ้าหน้าที่ตรวจสอบสินค้าแล้ว'); render();
  });
  document.querySelectorAll('[data-act="removeCart"]').forEach(el=>el.onclick=()=>{cust.cart.splice(Number(el.dataset.idx),1); render();});
  const closeModalOverlay=document.getElementById('closeModalOverlay'); if(closeModalOverlay) closeModalOverlay.onclick=(e)=>{if(e.target.id==='closeModalOverlay'){cust.modalProduct=null; render();}};
  const closeModalBtn=document.getElementById('closeModalBtn'); if(closeModalBtn) closeModalBtn.onclick=()=>{cust.modalProduct=null; render();};

  document.querySelectorAll('[data-checktab]').forEach(el=>el.onclick=()=>{cust.checkTab=el.dataset.checktab; cust.checkResult=null; cust.orderTrackResult=null; render();});
  const checkBtn=document.getElementById('checkBtn');
  if(checkBtn) checkBtn.onclick=()=>{
    const q=document.getElementById('checkInput').value.trim(); if(!q) return; cust.checkQuery=q;
    if(cust.checkTab==='name') runCheck(q,false);
    else if(cust.checkTab==='order') runOrderTrack(q);
    else { cust.pendingPayment={stage:'confirm',code:q}; render(); }
  };
  const payCancel=document.getElementById('payCancel'); if(payCancel) payCancel.onclick=()=>{cust.pendingPayment=null; render();};
  const payCancel2=document.getElementById('payCancel2'); if(payCancel2) payCancel2.onclick=()=>{cust.pendingPayment=null; render();};
  const payConfirmBtn=document.getElementById('payConfirmBtn');
  if(payConfirmBtn) payConfirmBtn.onclick=async()=>{cust.pendingPayment.stage='processing'; render(); await sleep(1400); cust.pendingPayment.stage='success'; render();};
  const paySeeResult=document.getElementById('paySeeResult');
  if(paySeeResult) paySeeResult.onclick=()=>{const code=cust.pendingPayment.code; cust.pendingPayment=null; runCheck(code,true);};

  const reserveForm=document.getElementById('reserveForm');
  if(reserveForm) reserveForm.onsubmit=async(e)=>{
    e.preventDefault(); const fd=new FormData(reserveForm); const prod=DB.products.find(p=>p.id===fd.get('productId'));
    const rec={id:uid('BK-2026'), name:fd.get('name'), phone:fd.get('phone'), productName:prod?prod.name:'-', qty:Number(fd.get('qty')), branch:fd.get('branch'), date:fd.get('date'), status:'รอตรวจสอบ', created:new Date().toISOString().slice(0,10)};
    DB.reservations.push(rec); await saveDB(); cust.selectedProduct=null; toast('จองสำเร็จ เลขที่การจอง '+rec.id); setCustPage('home');
  };
  const contactForm=document.getElementById('contactForm');
  if(contactForm) contactForm.onsubmit=async(e)=>{
    e.preventDefault(); const fd=new FormData(contactForm);
    DB.tickets.push({id:uid('TK'), name:fd.get('name'), phone:fd.get('phone'), topic:fd.get('topic'), detail:fd.get('detail'), status:'รอดำเนินการ', created:new Date().toISOString().slice(0,10)});
    await saveDB(); toast('ส่งคำร้องเรียบร้อย เจ้าหน้าที่จะติดต่อกลับ'); render();
  };
  const checkoutBtn=document.getElementById('checkoutBtn');
  if(checkoutBtn) checkoutBtn.onclick=()=>{const total=cust.cart.reduce((s,c)=>s+c.price*c.qty,0); cust.checkoutInfo={name:cust.cart.map(c=>c.name).join(', '), qty:cust.cart.reduce((s,c)=>s+c.qty,0), total}; render();};
  const closeCheckout=document.getElementById('closeCheckout'); if(closeCheckout) closeCheckout.onclick=()=>{cust.checkoutInfo=null; render();};
  const closeCheckout2=document.getElementById('closeCheckout2'); if(closeCheckout2) closeCheckout2.onclick=()=>{cust.checkoutInfo=null; render();};
  const confirmOrderBtn=document.getElementById('confirmOrderBtn');
  if(confirmOrderBtn) confirmOrderBtn.onclick=async()=>{
    const orderCode = uid('ORD-2026');
    const order = {id:orderCode, items:cust.cart.map(c=>({name:c.name,code:c.code,qty:c.qty,price:c.price})), total:cust.checkoutInfo.total, status:'รอดำเนินการ', created:new Date().toISOString().slice(0,10)};
    DB.orders.push(order);
    await saveDB();
    cust.cart=[];
    cust.checkoutInfo={...cust.checkoutInfo, done:true, orderCode};
    render();
  };
  const orderDoneBtn=document.getElementById('orderDoneBtn');
  if(orderDoneBtn) orderDoneBtn.onclick=()=>{cust.checkoutInfo=null; setCustPage('home');};

  const chatFab=document.getElementById('chatFab');
  if(chatFab) chatFab.onclick=()=>{cust.chatOpen=!cust.chatOpen; if(cust.chatOpen && cust.chatMessages.length===0) initChat(); render(); setTimeout(scrollChatBottom,50);};
  const chatClose=document.getElementById('chatClose'); if(chatClose) chatClose.onclick=()=>{cust.chatOpen=false; render();};
  document.querySelectorAll('[data-qm]').forEach(el=>el.onclick=()=>chatHandleQuick(el.dataset.qm));
  const chatSendBtn=document.getElementById('chatSendBtn'); const chatTextInput=document.getElementById('chatTextInput');
  function sendChat(){const v=chatTextInput.value.trim(); if(!v)return; chatTextInput.value=''; if(cust.liveSessionId) sendLiveMessage(v); else chatHandleProductQuery(v);}
  if(chatSendBtn) chatSendBtn.onclick=sendChat;
  if(chatTextInput) chatTextInput.onkeydown=(e)=>{if(e.key==='Enter') sendChat();};
  scrollChatBottom();
}

(async function init(){ await loadDB(); render(); })();
</script>
</body>
</html>
